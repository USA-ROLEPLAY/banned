name: Ban Appeal State Prune

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ban-appeal-state
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Remove expired cooldowns
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const STATE_PATH = '.github/appeal_state.json';
            async function getFile(path) {
              try {
                const res = await github.rest.repos.getContent({ owner, repo, path });
                return { sha: res.data.sha, content: Buffer.from(res.data.content, 'base64').toString('utf8') };
              } catch (e) {
                if (e.status === 404) return null;
                throw e;
              }
            }
            async function putFile(path, content, sha, message) {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, message,
                content: Buffer.from(content, 'utf8').toString('base64'),
                sha
              });
            }
            const sf = await getFile(STATE_PATH);
            if (!sf) return; // nothing to prune
            let state;
            try { state = JSON.parse(sf.content); } catch { return; }
            const before = state.entries.length;
            const now = new Date();
            state.entries = state.entries.filter(e => new Date(e.expires_at) > now);
            const after = state.entries.length;
            if (after !== before) {
              await putFile(STATE_PATH, JSON.stringify(state, null, 2), sf.sha,
                `ban-appeal: pruned ${before - after} expired cooldown(s)`);
            }
